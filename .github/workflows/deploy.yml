name: CI/CD to opozdal.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ШАГ 1: Проверка текста в opozdun.scr
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_text.outputs.result }}
    steps:
      - name: Получение кода из репозитория
        uses: actions/checkout@v4

      - name: Запуск тестового скрипта
        id: check_text
        run: |
          chmod +x test.sh
          if ./test.sh; then
            echo "result=deploy" >> $GITHUB_OUTPUT
          else
            echo "result=delete" >> $GITHUB_OUTPUT
          fi

  # ШАГ 2: Разворачивание на opozdal.ru (если тест пройден)
  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.should_deploy == 'deploy'
    steps:
      - name: Получение кода из репозитория
        uses: actions/checkout@v4

      - name: Разворачивание приложения на opozdal.ru
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H opozdal.ru >> ~/.ssh/known_hosts
          
          echo ">>> Копирование файлов на opozdal.ru..."
          # ЗАМЕНИТЕ /var/www/html/ НА ПУТЬ ИЗ ВАШЕЙ 2-й ЛАБОРАТОРНОЙ
          scp -r index.html opozdun.scr ${{ secrets.SSH_USER }}@opozdal.ru:/var/www/html/
          echo ">>> Деплой на opozdal.ru завершен!"

  # ШАГ 3: Удаление с opozdal.ru (если тест провален)
  delete:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.should_deploy == 'delete'
    steps:
      - name: Удаление приложения с opozdal.ru
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H opozdal.ru >> ~/.ssh/known_hosts
          
          echo ">>> Удаление файлов с opozdal.ru..."
          # ЗАМЕНИТЕ /var/www/html/ НА ПУТЬ ИЗ ВАШЕЙ 2-й ЛАБОРАТОРНОЙ
          ssh ${{ secrets.SSH_USER }}@opozdal.ru "rm -rf /var/www/html/index.html /var/www/html/opozdun.scr"
          echo ">>> Файлы удалены с opozdal.ru!"